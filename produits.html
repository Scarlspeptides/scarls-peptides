<script src="common.js"></script>
<script>
const PT_TEXT = {
  fr:['Catalogue','Références regroupées par thème de recherche, avec une présentation courte et claire.','Important','les références sont présentées pour la recherche uniquement. Elles ne sont pas destinées à l’utilisation chez l’être humain ou l’animal.'],
  en:['Catalogue','References grouped by research theme, with a short and clear presentation.','Important','references are presented for research only. They are not intended for use in humans or animals.'],
  pt:['Catálogo','Referências agrupadas por tema de investigação, com uma apresentação curta e clara.','Importante','as referências são apresentadas apenas para investigação. Não se destinam a utilização em seres humanos ou animais.'],
  es:['Catálogo','Referencias agrupadas por tema de investigación, con una presentación breve y clara.','Importante','las referencias se presentan únicamente para investigación. No están destinadas al uso en humanos o animales.']
};

const groups = {
fr:[['Peau & régénération',[['GHK-Cu','100mg','Recherche cutanée & matrice extracellulaire','100 €'],['KLOW','80mg','Recherche sur les mécanismes de régénération','150 €']]],['Muscle & récupération',[['DSIP','5mg','Recherche sommeil & récupération','50 €'],['CJC no DAC + Ipamorelin','10mg','Recherche sur les mécanismes de croissance','100 €']]],['Cognition & système nerveux',[['Semax','5mg','Recherche en neurobiologie & cognition','50 €'],['Selank','5mg','Recherche en neurobiologie & stress','50 €']]],['Métabolisme & énergie',[['Retatrutide','10mg','Recherche métabolique','150 €'],['MOTS-C','10mg','Recherche métabolisme & énergie cellulaire','70 €'],['NAD+','100mg','Recherche en biologie cellulaire','70 €'],['L-Carnitine','1200mg','Recherche métabolisme énergétique','60 €']]],['Longévité & biologie cellulaire',[['Epitalon','10mg','Recherche vieillissement cellulaire','50 €']]],['Pigmentation',[['Melanotan I','10mg','Recherche sur la pigmentation','60 €']]],['Autres références',[['Glutathion','600mg','Recherche sur les systèmes antioxydants','65 €']]]],
en:[['Skin & regeneration',[['GHK-Cu','100mg','Skin research & extracellular matrix','€100'],['KLOW','80mg','Research into regeneration mechanisms','€150']]],['Muscle & recovery',[['DSIP','5mg','Sleep & recovery research','€50'],['CJC no DAC + Ipamorelin','10mg','Research into growth mechanisms','€100']]],['Cognition & nervous system',[['Semax','5mg','Neurobiology & cognition research','€50'],['Selank','5mg','Neurobiology & stress research','€50']]],['Metabolism & energy',[['Retatrutide','10mg','Metabolic research','€150'],['MOTS-C','10mg','Metabolism & cellular energy research','€70'],['NAD+','100mg','Cell biology research','€70'],['L-Carnitine','1200mg','Energy metabolism research','€60']]],['Longevity & cell biology',[['Epitalon','10mg','Cellular ageing research','€50']]],['Pigmentation',[['Melanotan I','10mg','Pigmentation research','€60']]],['Other references',[['Glutathion','600mg','Research on antioxidant systems','€65']]]],
pt:[['Pele & regeneração',[['GHK-Cu','100mg','Investigação cutânea e matriz extracelular','€100'],['KLOW','80mg','Investigação dos mecanismos de regeneração','€150']]],['Músculo & recuperação',[['DSIP','5mg','Investigação do sono e recuperação','€50'],['CJC no DAC + Ipamorelin','10mg','Investigação dos mecanismos de crescimento','€100']]],['Cognição & sistema nervoso',[['Semax','5mg','Investigação em neurobiologia e cognição','€50'],['Selank','5mg','Investigação em neurobiologia e stress','€50']]],['Metabolismo & energia',[['Retatrutide','10mg','Investigação metabólica','€150'],['MOTS-C','10mg','Investigação do metabolismo e energia celular','€70'],['NAD+','100mg','Investigação em biologia celular','€70'],['L-Carnitine','1200mg','Investigação do metabolismo energético','€60']]],['Longevidade & biologia celular',[['Epitalon','10mg','Investigação do envelhecimento celular','€50']]],['Pigmentação',[['Melanotan I','10mg','Investigação sobre pigmentação','€60']]],['Outras referências',[['Glutathion','600mg','Investigação dos sistemas antioxidantes','€65']]]],
es:[['Piel & regeneración',[['GHK-Cu','100mg','Investigación cutánea y matriz extracelular','€100'],['KLOW','80mg','Investigación de los mecanismos de regeneración','€150']]],['Músculo & recuperación',[['DSIP','5mg','Investigación del sueño y la recuperación','€50'],['CJC no DAC + Ipamorelin','10mg','Investigación de los mecanismos de crecimiento','€100']]],['Cognición & sistema nervioso',[['Semax','5mg','Investigación en neurobiología y cognición','€50'],['Selank','5mg','Investigación en neurobiología y estrés','€50']]],['Metabolismo & energía',[['Retatrutide','10mg','Investigación metabólica','€150'],['MOTS-C','10mg','Investigación del metabolismo y energía celular','€70'],['NAD+','100mg','Investigación en biología celular','€70'],['L-Carnitine','1200mg','Investigación del metabolismo energético','€60']]],['Longevidad & biología celular',[['Epitalon','10mg','Investigación del envejecimiento celular','€50']]],['Pigmentación',[['Melanotan I','10mg','Investigación sobre la pigmentación','€60']]],['Otras referencias',[['Glutathion','600mg','Investigación sobre los sistemas antioxidantes','€65']]]]
};

const ADD_LABEL = {fr:'Ajouter',en:'Add',pt:'Adicionar',es:'Añadir'};

function setPageLang(l){
  const pt = PT_TEXT[l];
  document.getElementById('ptitle').textContent = pt[0];
  document.getElementById('pintro').textContent = pt[1];
  let out = '';
  groups[l].forEach((g,gi)=>{
    out += `<div class="cat-group" id="cat${gi}"><h2>${g[0]}</h2>`;
    g[1].forEach((x,ri)=>{
      out += `<div class="ref-row" style="animation:fadeUp .55s ${ri*0.06}s both" data-name="${x[0]}" data-dose="${x[1]}" data-price="${x[3]}">
        <div class="ref-main"><span class="ref-name">${x[0]}</span><span class="ref-dose">${x[1]}</span></div>
        <div class="ref-use">${x[2]}</div>
        <div class="ref-price mono">${x[3]}</div>
        <button class="btn small ref-add" type="button" onclick="toggleSelection(this)">${ADD_LABEL[l]}</button>
      </div>`;
    });
    out += `</div>`;
  });
  out += `<div class="notice"><strong>${pt[2]}:</strong> ${pt[3]}</div>`;
  document.getElementById('catalogue').innerHTML = out;
  renderSelection();
}
setPageLang(currentLang());
</script>
