<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="header-in">
    <a class="brand" href="index.html">
      <img src="logo.jpg" alt="">
      <span class="brand-name">Scarl’s Peptides</span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Accueil</a>
      <a href="produits.html">Produits</a>
      <a href="apropos.html">À propos</a>

      <a href="faq.html" class="current">FAQ</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="langs">
      <button class="lang active" data-lang="fr">FR</button>
      <button class="lang" data-lang="en">EN</button>
      <button class="lang" data-lang="pt">PT</button>
      <button class="lang" data-lang="es">ES</button>
    </div>
  </div>
</header>

<div class="page-head">
  <h1 id="title">FAQ</h1>
  <p id="intro">Quelques réponses rapides.</p>
</div>

<main><div id="list"></div></main>

<footer><div class="footer-in" id="footerText"></div></footer>

<script src="common.js"></script>
<script>
const F = {
  fr:{title:'FAQ',intro:'Quelques réponses rapides.',q:[
    ['Comment obtenir des informations ?','Contacte-nous via WhatsApp pour toute demande concernant le catalogue ou la documentation.'],
    ['Les tarifs sont-ils définitifs ?','Les tarifs affichés sont définitifs.'],
    ['Les produits sont-ils destinés à être utilisés par l’homme ?','Non. Le site les présente uniquement dans un contexte de recherche.'],
    ['Comment contacter l’équipe ?','Le bouton WhatsApp de la page Contact ouvre une conversation avec Scarl’s Peptides.']
  ]},
  en:{title:'FAQ',intro:'A few quick answers.',q:[
    ['How can I get information?','Contact us via WhatsApp for questions about the catalogue or documentation.'],
    ['Are the prices final?','The displayed prices are final.'],
    ['Are the products intended for human use?','No. The site presents them only in a research context.'],
    ['How can I contact the team?','The WhatsApp button on the Contact page opens a conversation with Scarl’s Peptides.']
  ]},
  pt:{title:'FAQ',intro:'Algumas respostas rápidas.',q:[
    ['Como obter informações?','Contacte-nos pelo WhatsApp para qualquer questão sobre o catálogo ou documentação.'],
    ['Os preços são definitivos?','Os preços apresentados são definitivos.'],
    ['Os produtos destinam-se a utilização humana?','Não. O site apresenta-os apenas num contexto de investigação.'],
    ['Como contactar a equipa?','O botão WhatsApp da página Contacto abre uma conversa com a Scarl’s Peptides.']
  ]},
  es:{title:'FAQ',intro:'Algunas respuestas rápidas.',q:[
    ['¿Cómo obtener información?','Contáctanos por WhatsApp para cualquier consulta sobre el catálogo o la documentación.'],
    ['¿Los precios son definitivos?','Los precios mostrados son definitivos.'],
    ['¿Los productos están destinados al uso humano?','No. El sitio los presenta únicamente en un contexto de investigación.'],
    ['¿Cómo contactar con el equipo?','El botón de WhatsApp de la página Contacto abre una conversación con Scarl’s Peptides.']
  ]}
};
function setPageLang(l){
  const d = F[l];
  document.getElementById('title').textContent = d.title;
  document.getElementById('intro').textContent = d.intro;
  document.getElementById('list').innerHTML = d.q.map(item=>
    `<div class="faq-item"><h3>${item[0]}</h3><p>${item[1]}</p></div>`
  ).join('');
}
setPageLang(currentLang());
</script>
</body>
</html>
