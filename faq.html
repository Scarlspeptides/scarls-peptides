  <script>
    const FAQ = {fr:{head:['Centre d’aide','Questions fréquentes.','Les réponses essentielles, sans détour.'],q:[['Comment obtenir des informations ?','Contactez-nous via WhatsApp pour toute demande concernant le catalogue ou la documentation.'],['Les références sont-elles destinées à l’utilisation humaine ?','Non. Elles sont présentées uniquement dans un contexte de recherche et ne sont pas destinées à une utilisation chez l’être humain ou l’animal.'],['Puis-je commander ou payer depuis le site ?','Non. Cette vitrine ne traite ni commande ni paiement. La sélection permet uniquement de préparer une demande d’information.'],['Comment fonctionne ma sélection ?','Ajoutez les références qui vous intéressent, puis copiez ou téléchargez votre fiche. Vous pouvez ensuite l’envoyer avec votre demande.']]},en:{head:['Help centre','Frequently asked questions.','The essential answers, without detours.'],q:[['How can I get information?','Contact us via WhatsApp with any question about the catalogue or documentation.'],['Are the references intended for human use?','No. They are shown in a research context only and are not intended for use in humans or animals.'],['Can I order or pay through the site?','No. This showcase handles neither orders nor payments. The selection only helps you prepare an information request.'],['How does my selection work?','Add the references that interest you, then copy or download your sheet. You can send it with your request.']]},pt:{head:['Centro de ajuda','Perguntas frequentes.','As respostas essenciais, sem rodeios.'],q:[['Como obter informações?','Contacte-nos pelo WhatsApp para qualquer questão sobre o catálogo ou a documentação.'],['As referências destinam-se a utilização humana?','Não. São apresentadas apenas num contexto de investigação e não se destinam a utilização em seres humanos ou animais.'],['Posso encomendar ou pagar no site?','Não. Esta vitrine não trata de encomendas nem pagamentos. A seleção serve apenas para preparar um pedido de informação.'],['Como funciona a minha seleção?','Adicione as referências que lhe interessam e copie ou descarregue a sua ficha. Pode enviá-la com o seu pedido.']]},es:{head:['Centro de ayuda','Preguntas frecuentes.','Las respuestas esenciales, sin rodeos.'],q:[['¿Cómo puedo obtener información?','Contáctanos por WhatsApp para cualquier consulta sobre el catálogo o la documentación.'],['¿Las referencias están destinadas al uso humano?','No. Se presentan únicamente en un contexto de investigación y no están destinadas al uso en humanos o animales.'],['¿Puedo pedir o pagar desde el sitio?','No. Este escaparate no procesa pedidos ni pagos. La selección solo sirve para preparar una solicitud de información.'],['¿Cómo funciona mi selección?','Añade las referencias que te interesen y copia o descarga tu ficha. Puedes enviarla con tu solicitud.']]} };
    function setPageLang(l){const d=FAQ[l];['eyebrow','title','lead'].forEach((id,i)=>document.getElementById(id).textContent=d.head[i]);document.getElementById('faqList').innerHTML=d.q.map((x,i)=>`<article class="faq-item ${i===0?'open':''}"><button class="faq-trigger" type="button" aria-expanded="${i===0}"><span>${x[0]}</span><span class="faq-icon">+</span></button><div class="faq-answer"><div><p>${x[1]}</p></div></div></article>`).join('');document.querySelectorAll('.faq-trigger').forEach(btn=>btn.addEventListener('click',()=>{const item=btn.closest('.faq-item');const open=item.classList.toggle('open');btn.setAttribute('aria-expanded',String(open));}));}
