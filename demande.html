<script>

const T={fr:{back:"Retour",title:"Demande d'information",subtitle:"Sélectionne des références pour créer un récapitulatif informatif.",refs:"Références",summaryTitle:"Récapitulatif",total:"Total indicatif",name:"Nom",phone:"WhatsApp / Téléphone",message:"Message",nameph:"Votre nom",phoneph:"+33...",messageph:"Votre demande d'information...",download:"⬇ Télécharger le récapitulatif",send:"💬 Préparer WhatsApp",note:"Ce récapitulatif est informatif et ne constitue pas une commande, un paiement ou une confirmation de disponibilité."},

function euro(n){return new Intl.NumberFormat(lang==="en"?"en-GB":"fr-FR",{style:"currency",currency:"EUR"}).format(n)}
function render(){items.innerHTML=catalog.map((p,i)=>`<div class="item"><span>${p.name} ${p.dose} — ${euro(p.price)}</span><div class="qty"><button onclick="chg(${i},-1)">−</button><b>${cart[i]||0}</b><button onclick="chg(${i},1)">+</button></div></div>`).join("");let keys=Object.keys(cart),tot=0;summary.innerHTML=keys.length?keys.map(k=>{let p=catalog[k],q=cart[k],v=p.price*q;tot+=v;return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ffffff10"><span>${p.name} ${p.dose} × ${q}</span><b>${euro(v)}</b></div>`}).join(""):"<span style='color:#77738e'>Aucun article sélectionné.</span>";total.textContent=T[lang].total+": "+euro(tot)}
function chg(i,d){cart[i]=Math.max(0,(cart[i]||0)+d);if(!cart[i])delete cart[i];render()}
function setLang(l){lang=l;localStorage.setItem("scarlLang",l);let t=T[l];["back","title","subtitle","refs","summaryTitle","download","send","note"].forEach(id=>document.getElementById(id).textContent=t[id]);nameL.childNodes[0].textContent=t.name;phoneL.childNodes[0].textContent=t.phone;msgL.childNodes[0].textContent=t.message;name.placeholder=t.nameph;phone.placeholder=t.phoneph;message.placeholder=t.messageph;document.querySelectorAll(".lang").forEach(b=>b.classList.toggle("active",b.dataset.lang===l));render()}

download.onclick=()=>{if(!Object.keys(cart).length)return alert("Sélectionne au moins une référence.");let b=new Blob([text()],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="scarls-information-request.txt";a.click();URL.revokeObjectURL(a.href)}
send.onclick=()=>{if(!Object.keys(cart).length)return alert("Sélectionne au moins une référence.");window.open("https://wa.me/33664694830?text="+encodeURIComponent(text()),"_blank")}
