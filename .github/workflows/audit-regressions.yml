name: Audit regression checks
on:
  push:
    branches:
      - audit/ux-performance-2026-11-04
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run static and syntax regression checks
        run: python -m unittest discover -s tests -p 'test_audit_regressions.py' -v
